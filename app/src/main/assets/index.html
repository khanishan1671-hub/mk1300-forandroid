<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ishan's MK1300 Mobile Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ff;
      --bg: #030613;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #15092a 0%, var(--bg) 75%);
      font-family: 'Rajdhani', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      user-select: none;
      -webkit-user-select: none;
    }
    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.8rem;
      margin: 0;
      background: linear-gradient(to right, var(--neon-cyan), var(--neon-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      letter-spacing: 2px;
    }
    .sub-title {
      font-size: 0.95rem;
      color: #a5b4fc;
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
    }
    .btn-connect {
      width: 100%;
      max-width: 380px;
      background: rgba(0, 243, 255, 0.08);
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 1px;
      border: 1px solid var(--neon-cyan);
      border-radius: 12px;
      padding: 1rem;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }
    #status {
      font-size: 0.85rem;
      margin: 0.8rem 0;
      color: #ef4444;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .controls {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      opacity: 0.35;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .controls.active {
      opacity: 1;
      pointer-events: all;
    }
    .wheel-container {
      display: flex;
      justify-content: center;
      margin: 0.5rem 0;
    }
    .row {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    label {
      font-size: 0.85rem;
      color: var(--neon-cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    select {
      background: rgba(10, 15, 30, 0.8);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 0.75rem;
      border-radius: 10px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      outline: none;
    }
    select option { background: #070c1a; }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      padding: 8px 0;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: var(--neon-magenta);
      margin-top: -7px;
      box-shadow: 0 0 10px var(--neon-magenta);
    }
  </style>
</head>
<body>

  <h1 class="brand-title">GAMING UNLIMITED</h1>
  <div class="sub-title">Ishan's MK1300 Engine</div>

  <button id="btnConnect" class="btn-connect">Connect Keyboard (OTG)</button>
  <div id="status">Hardware Offline</div>

  <div class="controls" id="controlPanel">
    <div class="wheel-container">
      <div id="colorWheel"></div>
    </div>

    <div class="row">
      <label>Lighting Mode</label>
      <select id="effectSelect">
        <option value="1">1: Static</option>
        <option value="2">2: Breath</option>
        <option value="3">3: Swing</option>
        <option value="4">4: Spin</option>
        <option value="5">5: Stream</option>
        <option value="6">6: Bloom</option>
        <option value="7">7: UDWawe</option>
        <option value="8">8: Cross</option>
        <option value="9">9: Rain</option>
        <option value="10">10: Meteor</option>
        <option value="11">11: TrigSpread</option>
        <option value="12">12: TrigSpreadReverse</option>
        <option value="13">13: TrigSingle</option>
        <option value="14">14: Soduko</option>
        <option value="15">15: Tide</option>
        <option value="16">16: UserLight</option>
        <option value="0">0: Light Off</option>
      </select>
    </div>

    <div class="row">
      <label>Brightness</label>
      <input type="range" id="brightRange" min="0" max="4" value="4">
    </div>

    <div class="row">
      <label>Speed</label>
      <input type="range" id="speedRange" min="0" max="4" value="2">
    </div>
  </div>

  <script>
    const btnConnect = document.getElementById('btnConnect');
    const statusText = document.getElementById('status');
    const controlPanel = document.getElementById('controlPanel');
    const effectSelect = document.getElementById('effectSelect');
    const brightRange = document.getElementById('brightRange');
    const speedRange = document.getElementById('speedRange');

    let debounceTimer = null;

    const colorPicker = new iro.ColorPicker("#colorWheel", {
      width: 200,
      color: "#ff00ff",
      borderWidth: 2,
      borderColor: "rgba(255,255,255,0.15)",
      layout: [{ component: iro.ui.Wheel }]
    });

    function getHardwareHSV(hex) {
      let r = parseInt(hex.slice(1, 3), 16) / 255;
      let g = parseInt(hex.slice(3, 5), 16) / 255;
      let b = parseInt(hex.slice(5, 7), 16) / 255;
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max, d = max - min;
      s = max === 0 ? 0 : d / max;
      if (max === min) h = 0;
      else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [Math.floor(h * 255), Math.floor(s * 255), Math.floor(v * 255)];
    }

    function pushToAndroid() {
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const mode = parseInt(effectSelect.value, 10);
        const br = parseInt(brightRange.value, 10);
        const sp = parseInt(speedRange.value, 10);
        const [h, s, v] = getHardwareHSV(colorPicker.color.hexString);

        // Hardware command structure: opcode 11
        const lightConfig = [1, 0, mode, br, sp, 1, 1, 0, h, s, v];
        const payload = [11, lightConfig.length, 0, 0, ...lightConfig];
        const cmd = [0, 6, ...payload];
        
        // Build 65-byte hex string
        const buffer = new Uint8Array(65);
        cmd.forEach((val, i) => { if (i < 65) buffer[i] = val; });

        let hex = '';
        buffer.forEach(b => { hex += b.toString(16).padStart(2, '0'); });

        if (window.AndroidBridge && window.AndroidBridge.sendRawReport) {
          window.AndroidBridge.sendRawReport(hex);
        }
      }, 35);
    }

    colorPicker.on('color:change', pushToAndroid);
    effectSelect.addEventListener('change', pushToAndroid);
    brightRange.addEventListener('input', pushToAndroid);
    speedRange.addEventListener('input', pushToAndroid);

    btnConnect.addEventListener('click', () => {
      if (window.AndroidBridge && window.AndroidBridge.requestDevice) {
        window.AndroidBridge.requestDevice();
      }
    });

    // Called from Java once permissions pass
    window.onUsbConnected = function() {
      btnConnect.style.display = 'none';
      controlPanel.classList.add('active');
      statusText.textContent = "HARDWARE LINKED: ACTIVE";
      statusText.style.color = 'var(--neon-cyan)';
      pushToAndroid();
    };
  </script>
</body>
</html>
