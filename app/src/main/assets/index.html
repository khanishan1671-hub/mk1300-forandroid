<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gaming With Ishan - MK1300 Engine</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ff;
      --neon-purple: #8a2be2;
      --bg-deep: #03050a;
      --glass-bg: rgba(8, 12, 24, 0.85);
      --glass-border: rgba(0, 243, 255, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 10px;
      min-height: 100vh;
      background: #000;
      font-family: 'Rajdhani', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.6rem;
      margin: 0;
      background: linear-gradient(to right, var(--neon-cyan), var(--neon-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .sub-title {
      font-size: 0.85rem;
      color: #a5b4fc;
      text-align: center;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }

    .btn-connect {
      background: rgba(0, 0, 0, 0.6);
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      border: 1px solid var(--neon-cyan);
      border-radius: 8px;
      padding: 0.8rem;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
    }

    #status {
      font-family: 'Share Tech Mono', monospace;
      color: #ef4444;
      font-size: 0.8rem;
      text-align: center;
      margin-top: 0.5rem;
    }

    .controls-grid {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      opacity: 0.25;
      pointer-events: none;
      transition: opacity 0.3s;
      margin-top: 1rem;
    }
    .controls-grid.active { opacity: 1; pointer-events: all; }

    .wheel-wrapper {
      margin: 0 auto;
      padding: 0.5rem;
    }

    .control-row label {
      display: block;
      font-size: 0.8rem;
      color: var(--neon-cyan);
      margin-bottom: 0.2rem;
      text-transform: uppercase;
    }

    select, input[type=range] { width: 100%; }
    select {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.6rem;
      border-radius: 6px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.95rem;
    }

    input[type=range] { -webkit-appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-runnable-track {
      height: 4px; background: rgba(255,255,255,0.15); border-radius: 4px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 18px; width: 18px; border-radius: 50%;
      background: var(--neon-magenta);
      -webkit-appearance: none; margin-top: -7px;
    }

    .terminal {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(0, 243, 255, 0.15);
      border-radius: 8px;
      padding: 0.8rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--neon-cyan);
      height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .log-line { margin: 0; }
    .log-line.glitch { color: var(--neon-magenta); }
    .log-line.success { color: #4ade80; }
  </style>
</head>
<body>

  <div class="container">
    <div class="panel">
      <h1 class="brand-title">GAMING WITH ISHAN</h1>
      <div class="sub-title">MK1300 OTG Engine</div>

      <button id="btnConnect" class="btn-connect">CONNECT VIA OTG</button>
      <div id="status">DISCONNECTED</div>

      <div class="controls-grid" id="controlGrid">
        <div class="wheel-wrapper">
          <div id="colorWheel"></div>
        </div>

        <div class="control-row">
          <label>Lighting Effect Mode</label>
          <select id="effectSelect">
            <option value="1">1: Static Core</option>
            <option value="2">2: Cyber Breath</option>
            <option value="3">3: Swing</option>
            <option value="4">4: Neon Spin</option>
            <option value="5">5: Data Stream</option>
            <option value="6">6: Bloom</option>
            <option value="7">7: UDWawe</option>
            <option value="8">8: Cross</option>
            <option value="9">9: Rain</option>
            <option value="10">10: Meteor</option>
            <option value="11">11: TrigSpread</option>
            <option value="12">12: TrigSpreadReverse</option>
            <option value="13">13: TrigSingle</option>
            <option value="14">14: Soduko</option>
            <option value="15">15: Tide</option>
            <option value="16">16: UserLight</option>
            <option value="0">0: System Dark</option>
          </select>
        </div>

        <div class="control-row">
          <label>Brightness</label>
          <input type="range" id="brightRange" min="0" max="4" value="4">
        </div>

        <div class="control-row">
          <label>Speed</label>
          <input type="range" id="speedRange" min="0" max="4" value="2">
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="terminal" id="terminalLog">
        <p class="log-line">&gt;&gt;&gt; ANDROID OTG READY</p>
        <p class="log-line">&gt;&gt;&gt; PLUG KEYBOARD VIA OTG &amp; TAP CONNECT</p>
      </div>
    </div>
  </div>

  <script>
    const terminal = document.getElementById('terminalLog');
    
    function addLog(text, type = '') {
      const p = document.createElement('p');
      p.className = `log-line ${type}`;
      p.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
      terminal.appendChild(p);
      terminal.scrollTop = terminal.scrollHeight;
    }

    let packetTimer = null;
    const btnConnect = document.getElementById('btnConnect');
    const effectSelect = document.getElementById('effectSelect');
    const brightRange = document.getElementById('brightRange');
    const speedRange = document.getElementById('speedRange');

    const colorPicker = new iro.ColorPicker("#colorWheel", {
      width: 150,
      color: "#00f3ff",
      layout: [{ component: iro.ui.Wheel }]
    });

    function getHardwareHSV(hex) {
      let r = parseInt(hex.slice(1, 3), 16) / 255;
      let g = parseInt(hex.slice(3, 5), 16) / 255;
      let b = parseInt(hex.slice(5, 7), 16) / 255;
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max, d = max - min;
      s = max === 0 ? 0 : d / max;
      if (max === min) h = 0;
      else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [Math.floor(h * 255), Math.floor(s * 255), Math.floor(v * 255)];
    }

    function autoPush() {
      if (packetTimer) clearTimeout(packetTimer);
      packetTimer = setTimeout(() => {
        const mode = parseInt(effectSelect.value, 10);
        const br = parseInt(brightRange.value, 10);
        const sp = parseInt(speedRange.value, 10);
        const [h, s, v] = getHardwareHSV(colorPicker.color.hexString);

        if (window.AndroidBridge && window.AndroidBridge.sendPacket) {
          window.AndroidBridge.sendPacket(mode, br, sp, h, s, v);
        }
      }, 40);
    }

    colorPicker.on('color:change', autoPush);
    effectSelect.addEventListener('change', autoPush);
    brightRange.addEventListener('input', autoPush);
    speedRange.addEventListener('input', autoPush);

    btnConnect.addEventListener('click', () => {
      if (window.AndroidBridge && window.AndroidBridge.initialize) {
        addLog("Initiating USB OTG Handshake...", "glitch");
        window.AndroidBridge.initialize();
      } else {
        addLog("Error: AndroidBridge not detected", "glitch");
      }
    });
  </script>
</body>
</html>
